name: BCG backtest data

on:
  push:
    branches: [tmp-price-fetch]
    paths: [.github/workflows/fetch.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install yfinance pandas requests
      - run: python research/bcg/fetch_bcg.py
      - if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f artifacts/bcg
          git commit -m "bcg data snapshot"
          git push
