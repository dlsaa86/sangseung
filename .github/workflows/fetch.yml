name: SPY excess study data

on:
  push:
    branches: [tmp-price-fetch]
    paths: [.github/workflows/fetch.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install yfinance pandas
      - run: python research/spy_excess/fetch_prices.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -f artifacts/prices
          git commit -m "price snapshot"
          git push
