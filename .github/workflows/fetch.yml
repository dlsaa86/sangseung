name: SPY excess study data

on:
  push:
    branches: [tmp-price-fetch]
    paths: [research/spy_excess/fetch_prices.py, .github/workflows/spy_excess_data.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install yfinance pandas
      - run: python research/spy_excess/fetch_prices.py
      - uses: actions/upload-artifact@v4
        with:
          name: spy-excess-prices
          path: artifacts/prices
