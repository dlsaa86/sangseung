<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#15161a;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;

 <div class="ph"><iframe id="b" src="./" width="852" height="393"></iframe></div></div>
</div>
<script>
function boot(id){var f=document.getElementById(id);
 f.addEventListener('load',function(){setTimeout(function(){try{
  var d=f.contentDocument.getElementById('g').contentDocument;
  var btn=[].slice.call(d.querySelectorAll('button')).filter(function(b){return /\uD0D1\s*\uC2B9/.test(b.textContent)})[0];
  if(btn) btn.click();
 }catch(e){}},2800)});}
boot('a');boot('b');
